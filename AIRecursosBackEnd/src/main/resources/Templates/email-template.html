<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #2ecc71;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.1);
        }
        .header {
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            text-align: center;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            margin: -30px -30px 30px;
        }
        h2 {
            color: white;
            margin: 0;
            font-weight: 600;
        }
        .content {
            text-align: center;
        }
        h3 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        .token {
            background-color: #e8f5e9;
            border: 1px solid #2ecc71;
            color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 20px 0;
            word-break: break-all;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }
        .disclaimer {
            color: #95a5a6;
            font-size: 0.8em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Recuperación de Contraseña</h2>
    </div>
    <div class="content">
        <h3>Hola, <span th:text="${nombreEmpresa}">Empresa</span></h3>
        <p>Tu token de recuperación es:.</p>
        <div class="token" th:text="${token}"></div>
    </div>
    <div class="footer">
        <p>© 2024 Air Movil. Todos los derechos reservados.</p>
        <div class="disclaimer">
            Si no solicitaste este token, por favor ignora este mensaje o contacta a soporte.
        </div>
    </div>
</div>
</body>
</html>
